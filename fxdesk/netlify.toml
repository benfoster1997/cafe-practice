# FX Desk - one Netlify site: the phone page, the API and the scheduled scanner.
# The deploy root is fxdesk/ so the functions can import the shared rules in core/.
[build]
  publish = "app/public"
  command = "echo 'static page, nothing to build'"

[functions]
  directory = "app/netlify/functions"
  node_bundler = "esbuild"

# The Home Screen app definition must be served as a web app manifest, or iOS may ignore it
# (and without it the iPhone will not offer notifications).
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# The background script must never be served stale.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
